# Exp 8: stage 2 with only `shell` isolated; each group still mounts its own policy.
# confinement runner) stays the host's, so no duplicate provider is created.
# executor timeoutMs differs per group only to tell the instances apart in tool output.
- id: verify
  name: cordis:group
  group: true
  isolate:
    shell: true
  config:
    - id: verify-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: read-only
    - id: verify-shell
      name: '@deepseek-ai/dsh-bash-sandbox'
      config:
        timeoutMs: 5000
    - id: check-runner
      name: ../../plugins/check-runner.mjs

- id: fix
  name: cordis:group
  group: true
  isolate:
    shell: true
  config:
    - id: fix-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: workspace-write
    - id: fix-shell
      name: '@deepseek-ai/dsh-bash-sandbox'
      config:
        timeoutMs: 60000
    - id: patch-note
      name: ../../plugins/patch-note.mjs
